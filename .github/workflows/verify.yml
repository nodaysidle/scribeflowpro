name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swiftpm:
    name: SwiftPM verify
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release
